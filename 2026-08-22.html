          p.cost_cny ? '¥' + p.cost_cny : ''
        ].filter(Boolean).join(' · ');
        const lineBadges = segs.filter(s => s.line).map(s =>
          `<span class="line-badge" style="background:${s.color}">L${s.line}</span>`
        ).join('');
        const swatch = p.type === 'metro' && segs.length > 1
          ? segs.map(s => `<span class="route-swatch" style="background:${s.color};width:10px;height:10px;display:inline-block;border-radius:2px;margin-right:2px"></span>`).join('')
          : `<span class="route-swatch" style="background:${p.color};width:14px;height:14px;display:inline-block;border-radius:3px"></span>`;

        const stepsForRoute = metroGuides.filter(g => g.route_key === parent);
        let stepsHtml = '';
        if (stepsForRoute.length) {
          stepsHtml = '<ol class="metro-steps">' + stepsForRoute.map(s => {
            const stepDone = doneSteps[s.route_key + '-' + s.num];
            const cls = (s.action === 'transfer' ? 'transfer' : '') + (stepDone ? ' done-step' : '');
            const lineTag = (s.lines || (s.line ? [s.line] : [])).map(ln =>
              `<span class="line-badge" style="background:${metroLineColors[ln]}">L${ln}</span>`
            ).join(' ');
            return `<li class="${cls}"><span class="step-num">${s.num}.</span>`
              + `<span class="step-action" style="color:${s.action_color}">${s.action_label}</span> `
              + `<b>${s.title}</b> ${lineTag}`
              + (s.direction ? `<br><small>→ ${s.direction}</small>` : '')
              + `<br><small>${s.instruction.substring(0, 120)}${s.instruction.length>120?'…':''}</small></li>`;
          }).join('') + '</ol>';
        }

        item.innerHTML = `
          <input type="checkbox" ${isDone ? 'checked' : ''} data-route="${parent}" title="Скрыть пройденный маршрут">
          <div style="display:flex;gap:2px;flex-wrap:wrap;margin-top:2px">${swatch}</div>
          <div style="flex:1">
            <div class="route-label">${typeIcon[p.type] || ''} ${p.route_label || p.label}</div>
            <div class="route-meta">${meta}</div>
            ${lineBadges ? '<div class="line-badges">' + lineBadges + '</div>' : ''}
            ${stepsHtml}
          </div>`;
        list.appendChild(item);
      });

      list.querySelectorAll('input[type=checkbox]').forEach(cb => {
        cb.addEventListener('change', () => {
          const name = cb.dataset.route;
          if (cb.checked) doneRoutes[name] = true;
          else delete doneRoutes[name];
          saveDoneRoutes(doneRoutes);
          applyRouteVisibility();
        });
      });
    }

    document.getElementById('showAllBtn').addEventListener('click', () => {
      doneRoutes = {};
      saveDoneRoutes(doneRoutes);
      applyRouteVisibility();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      if (confirm('Сбросить все отметки пройденных маршрутов и шагов?')) {
        doneRoutes = {};
        doneSteps = {};
        saveDoneRoutes(doneRoutes);
        saveDoneSteps();
        applyRouteVisibility();
      }
    });

    document.getElementById('togglePanel').addEventListener('click', (e) => {
      const panel = document.getElementById('routePanel');
      const collapsed = panel.classList.toggle('collapsed');
      e.target.textContent = collapsed ? '+' : '−';
    });

    // На телефоне панель по умолчанию свёрнута — больше места для карты
    if (window.matchMedia('(max-width: 480px)').matches) {
      const panel = document.getElementById('routePanel');
      panel.classList.add('collapsed');
      document.getElementById('togglePanel').textContent = '+';
    }

    applyRouteVisibility();

    const fitMap = () => map.fitBounds(bounds.pad(0.1), { animate: false, padding: [20, 20] });
    const refreshMapSize = () => {
      map.invalidateSize({ animate: false, pan: false });
      fitMap();
    };
    refreshMapSize();

    // Embed HTML / iframe: размер контейнера приходит позже — без этого серые «дыры» в тайлах
    if (window.self !== window.top) {
      [50, 150, 400, 1000].forEach(ms => setTimeout(refreshMapSize, ms));
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(() => refreshMapSize()).observe(document.getElementById('map'));
      }
    }
    window.addEventListener('resize', refreshMapSize);

    // В Obsidian (iframe): сначала клик — потом зум колёсиком, иначе скроллится заметка
    if (window.self !== window.top) {
      map.scrollWheelZoom.disable();
      const hint = L.control({ position: 'topright' });
      hint.onAdd = function() {
        const d = L.DomUtil.create('div', 'legend');
        d.id = 'mapHint';
        d.innerHTML = '<b>Кликните по карте</b><br>затем тяните пальцем/мышью<br>колёсико = зум';
        return d;
      };
      hint.addTo(map);
      map.once('click', () => {
        map.scrollWheelZoom.enable();
        const h = document.getElementById('mapHint');
        if (h) h.parentElement.parentElement.remove();
      });
    }

    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function() {
      const div = L.DomUtil.create('div', 'legend');
      div.innerHTML = '<b>Типы линий</b><br>'
        + '<i style="background:#2980b9"></i>Пешком<br>'
        + '<i style="background:#f39c12"></i>Такси<br>'
        + '<b>Метро Шанхая</b><br>'
        + "<i style=\"background:#82BF25\"></i>Line 2<br><i style=\"background:#D40068\"></i>Line 6<br><i style=\"background:#871C2B\"></i>Line 11<br>"
        + '<span style="color:#e74c3c">●</span> Отель<br>'
        + '<small>①②③ — шаги метро<br>'
        + '<span style="color:#e67e22">●</span> оранжевый = пересадка</small>';
      return div;
    };
    legend.addTo(map);
  </script>
</body>
</html>
